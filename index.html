<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chasse au trésor · JMLS 2026</title>
<style>
:root{--c:#D7182A;--t:#fff;--navy:#0A2540}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--navy);background:#EEF1F4;display:flex;justify-content:center}
.app{width:100%;max-width:480px;min-height:100vh;background:linear-gradient(180deg,#F6F7F9,#E3E6EA);position:relative;overflow:hidden;padding-bottom:28px}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px}.top img{height:44px}.top span{font-size:11px;font-weight:800;letter-spacing:2px;color:#5C6B7A}
.band{margin:8px 0 0;background:var(--c);color:var(--t);padding:14px 20px;font-weight:900;letter-spacing:1px;font-size:13px;gap:10px;display:flex;justify-content:space-between;align-items:center}
.band b{font-size:22px;white-space:nowrap;flex:none}
.card{margin:22px 18px 0;background:#fff;border-radius:22px;padding:26px 22px 24px;box-shadow:0 14px 30px rgba(10,37,64,.14);position:relative;border-top:8px solid var(--c)}
.lab{font-size:12px;font-weight:800;letter-spacing:3px;color:#8A97A6}
.expr{margin:10px 0 0;font-size:40px;line-height:1.1;font-weight:900;letter-spacing:-1px;color:var(--x,var(--c));word-break:break-word}
.fact{margin:22px 0 0;background:#F3F6FA;border-left:6px solid var(--navy);border-radius:10px;padding:14px 16px}
.fact b{display:block;font-size:12px;letter-spacing:3px;color:var(--navy);margin-bottom:6px}.fact p{margin:0;font-size:19px;line-height:1.35;font-weight:700}
.dots{display:flex;gap:8px;justify-content:center;margin:22px 0 4px}.dots i{width:30px;height:30px;border-radius:50%;border:3px solid #C9D3DD;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-weight:800;color:#8A97A6}
.dots i.on{background:var(--c);border-color:var(--c);color:var(--t)}.dots i.me{box-shadow:0 0 0 4px rgba(10,37,64,.18)}
.cnt{text-align:center;font-size:14px;font-weight:700;color:#5C6B7A}
.btn{display:block;width:calc(100% - 36px);margin:18px 18px 0;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;background:var(--navy);color:#fff;font-family:inherit}
.btn.ghost{background:transparent;color:#5C6B7A;border:2px solid #C9D3DD;font-weight:700}
.list{margin:14px 18px 0;background:#fff;border-radius:16px;padding:6px 16px;display:none}.list div{padding:11px 0;border-bottom:1px solid #E3E8EE;font-size:18px;font-weight:800;color:var(--x,var(--c))}.list div:last-child{border:0}.list small{display:block;font-size:11px;letter-spacing:2px;color:#8A97A6;font-weight:800}
.win{margin:18px 18px 0;background:var(--navy);color:#fff;border-radius:16px;padding:18px;font-weight:700;line-height:1.4;display:none}.win b{font-size:19px;display:block;margin-bottom:4px}
.rib{position:absolute;right:-26px;top:70px;height:150px;opacity:.12;transform:rotate(14deg);pointer-events:none}
.foot{text-align:center;margin-top:26px;font-size:11px;letter-spacing:2px;color:#8A97A6;font-weight:700}
.err{margin:60px 24px;text-align:center;font-weight:700;line-height:1.5}
</style></head><body><div class="app" id="app"></div>
